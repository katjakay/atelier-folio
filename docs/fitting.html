<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitting Room — Atelier Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --panel:#FAFAF9; --ink:#17140E; --ink-soft:#5B564C;
  --line:#E9E9E6; --accent:#6E6CEB; --chip:#F0F0EE;
  --good:#3F7D58; --warn:#B5762A; --bad:#A8443B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:14px;line-height:1.55;
  letter-spacing:0}
a{color:inherit}
.mono{font-family:"Roboto Mono",ui-monospace,monospace}
.eyebrow{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-soft)}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,54px)}

header{display:flex;justify-content:space-between;align-items:center;
  padding:26px 0;border-bottom:1px dotted var(--ink)}
.wordmark{font-family:"Roboto Mono",monospace;font-size:15px;letter-spacing:.2em;
  text-transform:uppercase;text-decoration:none}
.wordmark span{color:var(--accent)}
.back{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);text-decoration:none}

.hero{padding:clamp(46px,7vw,84px) 0 clamp(30px,4vw,48px)}
h1{font-size:clamp(22px,2.6vw,30px);line-height:1.05;letter-spacing:0;
  margin:10px 0 0;font-weight:500}
h1 em{font-style:italic;color:var(--ink);font-weight:400}
.lede{max-width:52ch;margin:22px 0 0;color:var(--ink-soft);
  font-size:clamp(15px,1.5vw,17px)}

/* dashboard */
.dash{padding:22px 0 34px;border-bottom:1px dotted var(--ink)}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:22px 30px}
.dcard .n{font-family:"Roboto Mono",monospace;font-size:clamp(26px,3.4vw,38px);
  font-weight:400;line-height:1}
.dcard .k{font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.dcard .seasonbar{margin-top:10px;height:6px;background:var(--chip);position:relative;
  overflow:hidden;border-radius:2px}
.dcard .seasonbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);
  display:block;border-radius:2px}
.slots{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:16px 30px}
.slot .lab{font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft)}
.slot .n{font-family:"Roboto Mono",monospace;font-size:19px;margin-top:4px}

/* view toggle */
.modebar{display:flex;justify-content:flex-end;padding:18px 0 0}
.modetoggle{display:flex;gap:4px;border:1px solid var(--line);border-radius:100px;padding:3px}
.modetoggle button{font-family:"Roboto Mono",monospace;font-size:12px;border:0;
  background:transparent;color:var(--ink-soft);padding:6px 16px;border-radius:100px;cursor:pointer}
.modetoggle button[aria-pressed="true"]{background:var(--accent);color:#fff}
.numview,.visview{display:block}
body.mode-visual .numview{display:none}
body.mode-numbers .visview{display:none}

.item{padding:clamp(30px,4vw,52px) 0;border-bottom:1px dotted var(--ink);
  display:grid;grid-template-columns:220px 1fr;gap:clamp(22px,3.5vw,48px)}
.shot{display:flex;align-items:center;justify-content:center;min-height:160px}
.shot img{width:100%;height:auto;display:block}
.shot .none{font-family:"Roboto Mono",monospace;font-size:11px;
  letter-spacing:.14em;color:var(--ink-soft)}

.title{font-size:clamp(16px,1.8vw,19px);letter-spacing:0;margin:6px 0 0;font-weight:400}

.verdict{display:inline-block;font-family:"Roboto Mono",monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;margin-top:18px;
  border:1px solid currentColor;border-radius:100px}
.v-good{color:var(--good)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)}

.metrics{margin-top:22px;display:grid;gap:16px}
.metric{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center}
.metric .lab{font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft)}
.bar{height:8px;background:var(--chip);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);display:block}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.val{font-family:"Roboto Mono",monospace;font-size:13px;white-space:nowrap}
.why{margin-top:20px;color:var(--ink-soft);font-size:14.5px;max-width:62ch}
.why b{color:var(--ink);font-weight:500}
.overlap{margin-top:12px;font-family:"Roboto Mono",monospace;font-size:11.5px;
  color:var(--ink-soft)}

/* outfit stepper — top / bottom / shoe stacked, wishlist item fixed */
.outfit{margin-top:26px;padding-top:22px}
.outfit .plabel{font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);margin:0 0 18px}
.stack{display:flex;flex-direction:column;align-items:center;gap:0;max-width:260px;
  margin:0 auto}
.srow{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;
  gap:6px;width:100%;padding:10px 0}

.sarrow{background:transparent;border:0;cursor:pointer;color:var(--ink-soft);
  font-family:"Roboto Mono",monospace;font-size:18px;line-height:1;padding:8px 4px;
  display:flex;align-items:center;justify-content:center}
.sarrow:hover{color:var(--ink)}
.sarrow:disabled{opacity:.25;cursor:default}
.sarrow.spacer{visibility:hidden;pointer-events:none}
.sfig{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-width:0;height:150px}
.sfig img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.srow[data-slot="shoe"] .sfig{height:64px}
.sfig .snone{font-family:"Roboto Mono",monospace;font-size:11px;color:var(--ink-soft);
  padding:14px 0}

.empty{padding:70px 0 90px;color:var(--ink-soft);max-width:56ch}
.empty code{background:var(--chip);padding:2px 6px;font-size:13px}
footer{padding:40px 0 70px;font-family:"Roboto Mono",monospace;font-size:11px;
  color:var(--ink-soft)}
@media(max-width:760px){
  .wrap{padding:0 18px}
  .item{grid-template-columns:1fr;gap:18px;padding:26px 0}
  .shot{max-width:200px;min-height:0}
  .baseline{gap:18px 26px}
  .metric{grid-template-columns:1fr;gap:6px}
  .metric .val{justify-self:start}
  .metric .lab{margin-bottom:2px}
  h1{font-size:clamp(20px,6vw,26px)}
  .back{padding:6px 0}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="theme-color" content="#FFFFFF">
</head>
<body>

<div class="wrap">
  <header>
    <a class="wordmark" href="index.html">ATELIER <span>·</span> FOLIO</a>
    <a class="back" href="index.html">← Inventory</a>
  </header>

  <section class="hero">
    <p class="eyebrow">Before you buy</p>
    <h1>Fitting <em>room</em></h1>
    <p class="lede">Jedes Teil auf der Wishlist, gerechnet gegen das, was schon im Schrank
      hängt — wie viele neue Kombinationen es bringt, was es pro Outfit kostet, und
      womit es sich überschneidet.</p>
  </section>

  <div class="dash" id="dash"></div>
  <div class="modebar">
    <div class="modetoggle" role="group" aria-label="Ansicht">
      <button id="mNum" aria-pressed="true">Numbers</button>
      <button id="mVis" aria-pressed="false">Visual</button>
    </div>
  </div>
  <div id="list"></div>

  <footer id="foot">wird geladen …</footer>
</div>

<script>
/* ---------- Slot-Zuordnung ---------- */
const TOP    = ["Top","Blouse","T-Shirt","Long-sleeve top","Bodysuit","Knits","Hoodie"];
const BOTTOM = ["Trousers","Shorts","Skirt","Leggings"];
const SHOE   = ["Shoes","Clogs","Sneakers","Sandals"];
const OUTER  = ["Jacket","Coat"];
const SEASONS = ["Sommer","Übergang","Winter"];

const slotOf = d => {
  const c = d.categories || [];
  if (c.some(x=>TOP.includes(x)))    return "top";
  if (c.some(x=>BOTTOM.includes(x))) return "bottom";
  if (c.some(x=>SHOE.includes(x)))   return "shoe";
  if (c.some(x=>OUTER.includes(x)))  return "outer";
  return "other";
};

/* Sport mischt sich nicht mit Smart — alles andere darf kombinieren */
const formOk = (a,b) => {
  if(!a||!b) return true;
  if(a==="Sport"||b==="Sport") return a===b;
  return true;
};
const shareSeason = (a,b) => (a||[]).some(s=>(b||[]).includes(s));

/* ---------- Farbfamilien ---------- */
const FAM = [
  [/wei|white|off.?white|ecru|cream/i,"weiß"],
  [/schwarz|black|off.?black/i,"schwarz"],
  [/braun|brown|coffee|taupe|stone|cognac|honey|greige|beige|camel|sand/i,"braun"],
  [/navy|indigo|blau|blue/i,"blau"],
  [/grau|grey|gray|silver/i,"grau"],
  [/gr[üu]n|green|sage|olive/i,"grün"],
];
const family = c => { for(const [re,n] of FAM) if(re.test(c||"")) return n; return "akzent"; };

/* ---------- Outfits zählen ---------- */
function outfits(items){
  const t = items.filter(d=>slotOf(d)==="top");
  const b = items.filter(d=>slotOf(d)==="bottom");
  const s = items.filter(d=>slotOf(d)==="shoe");
  let n = 0;
  for(const x of t) for(const y of b){
    if(!formOk(x.formality,y.formality) || !shareSeason(x.seasons,y.seasons)) continue;
    const both = (x.seasons||[]).filter(v=>(y.seasons||[]).includes(v));
    for(const z of s){
      if(!formOk(x.formality,z.formality) || !formOk(y.formality,z.formality)) continue;
      if(!both.some(v=>(z.seasons||[]).includes(v))) continue;
      n++;
    }
  }
  return n;
}

const eur = s => {
  const m = (s||"").replace(/\s/g,"").replace(/\./g,"").match(/(\d+),(\d{2})/);
  return m ? +m[1] + (+m[2])/100 : null;
};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bar = (pct,cls="") =>
  `<div class="bar"><i class="${cls}" style="width:${Math.max(2,Math.min(100,pct))}%"></i></div>`;

/* view mode toggle */
document.body.classList.add('mode-numbers');
const mNum=document.getElementById('mNum'),mVis=document.getElementById('mVis');
mNum.onclick=()=>{document.body.classList.replace('mode-visual','mode-numbers');
  mNum.setAttribute('aria-pressed','true');mVis.setAttribute('aria-pressed','false');};
mVis.onclick=()=>{document.body.classList.replace('mode-numbers','mode-visual');
  mVis.setAttribute('aria-pressed','true');mNum.setAttribute('aria-pressed','false');};

/* build the outfit stack: top / bottom / shoe, stepping through owned pieces
   that would combine with the wishlist item. The wishlist item occupies its
   own row fixed if it's a top/bottom/shoe; if it's a coat/jacket or
   unclassifiable, it gets its own row above the three, still fixed. */
function outfitRows(w, owned){
  const wSlot = slotOf(w);
  const rowSlots = ["top","bottom","shoe"];

  const rows = rowSlots.map(slot=>{
    if(slot===wSlot){
      return { slot, fixed:true, items:[w], label: rowLabel(slot) };
    }
    const candidates = owned.filter(d=>{
      if(slotOf(d)!==slot) return false;
      if(!formOk(w.formality,d.formality)) return false;
      if(!shareSeason(w.seasons,d.seasons)) return false;
      return true;
    });
    return { slot, fixed:false, items:candidates, label: rowLabel(slot) };
  });

  if(wSlot!=="top"&&wSlot!=="bottom"&&wSlot!=="shoe"){
    rows.unshift({ slot:"wish", fixed:true, items:[w], label:"Jacke/Mantel" });
  }
  return rows;
}
function rowLabel(slot){
  return slot==="top"?"Oberteil":slot==="bottom"?"Unterteil":"Schuh";
}

/* ---------- Rendern ---------- */
fetch("data.json?v="+Date.now())
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(p=>{
    const all   = p.items || [];
    const owned = all.filter(d=>d.status!=="Wishlist");
    const wish  = all.filter(d=>d.status==="Wishlist");
    const base  = outfits(owned);

    const perSeason = {};
    SEASONS.forEach(s=>{
      perSeason[s] = outfits(owned.filter(d=>(d.seasons||[]).includes(s)));
    });

    const maxSeason = Math.max(1, ...SEASONS.map(s=>perSeason[s]));
    const slotCounts = {
      top: owned.filter(d=>slotOf(d)==="top").length,
      bottom: owned.filter(d=>slotOf(d)==="bottom").length,
      shoe: owned.filter(d=>slotOf(d)==="shoe").length,
      outer: owned.filter(d=>slotOf(d)==="outer").length,
    };
    const slotLabel = {top:"Oberteile",bottom:"Unterteile",shoe:"Schuhe",outer:"Jacken/Mäntel"};

    document.getElementById("dash").innerHTML = `
      <div class="dashgrid">
        <div class="dcard"><div class="n">${owned.length}</div><div class="k">Teile im Schrank</div></div>
        <div class="dcard"><div class="n">${base}</div><div class="k">mögliche Outfits</div></div>
        ${SEASONS.map(s=>`
          <div class="dcard">
            <div class="n">${perSeason[s]}</div>
            <div class="k">${s}</div>
            <div class="seasonbar"><i style="width:${perSeason[s]/maxSeason*100}%"></i></div>
          </div>`).join("")}
      </div>
      <div class="slots">
        ${Object.keys(slotLabel).map(k=>`
          <div class="slot"><div class="lab">${slotLabel[k]}</div><div class="n">${slotCounts[k]}</div></div>
        `).join("")}
      </div>`;

    const list = document.getElementById("list");

    if(!wish.length){
      list.innerHTML = `<div class="empty">
        <p>Noch nichts auf der Wishlist.</p>
        <p>Leg in Notion eine Zeile an und setz <code>Status</code> auf <code>Wishlist</code>.
        Je mehr davon gefüllt ist — <code>Category</code>, <code>Colour</code>,
        <code>Season</code>, <code>Formality</code>, <code>Price</code> — desto schärfer
        rechnet diese Seite. Ohne Kategorie kann sie gar nichts sagen.</p></div>`;
    } else {
      const rowsByItem = [];
      const stepIx = {}; // "wi-ri" -> current index into row.items

      list.innerHTML = wish.map((w,wi)=>{
        const slot  = slotOf(w);
        const delta = outfits(owned.concat([w])) - base;
        const price = eur(w.price);
        const cpo   = (price!=null && delta>0) ? price/delta : null;

        // Redundanz: gleiche Slot-Ebene UND gleiche Farbfamilie
        const fam = family(w.color);
        const twins = owned.filter(d=>slotOf(d)===slot && family(d.color)===fam);
        const sameSlot = owned.filter(d=>slotOf(d)===slot).length;

        // Saison-Beitrag: wo ist der Schrank am dünnsten?
        const seasonGain = SEASONS
          .filter(s=>(w.seasons||[]).includes(s))
          .map(s=>({s, before: perSeason[s]}))
          .sort((a,b)=>a.before-b.before)[0];

        // Bewertung
        let verdict, cls, why;
        if(slot==="other"||slot==="outer"){
          verdict = "nicht berechenbar"; cls="v-warn";
          why = `Fällt nicht in die Rechnung Oberteil × Unterteil × Schuh — die Zahl wäre
                 irreführend. Bei Mänteln und Jacken zählt eher, ob die Saison abgedeckt ist.`;
        } else if(delta===0){
          verdict = "bringt nichts Neues"; cls="v-bad";
          why = `Erzeugt <b>keine einzige</b> neue Kombination. Meist heißt das: Saison oder
                 Anlass passen nicht zu dem, was du sonst besitzt.`;
        } else if(twins.length>=3){
          verdict = "stark redundant"; cls="v-bad";
          why = `Du besitzt bereits <b>${twins.length} Teile</b> derselben Art in
                 ${fam}. Die neuen Kombinationen entstehen rechnerisch, im Schrank
                 wäre es aber austauschbar.`;
        } else if(cpo!=null && cpo<2){
          verdict = "starker Kandidat"; cls="v-good";
          why = `Verteilt sich auf viele neue Kombinationen — der Preis pro Outfit liegt
                 unter zwei Euro. Genau das Muster, das Basisteile haben.`;
        } else if(twins.length===0){
          verdict = "schließt eine Lücke"; cls="v-good";
          why = `Kein vergleichbares Teil in ${fam} im Bestand. Neue Kategorie oder neuer
                 Ton — beides erweitert echt statt zu verdoppeln.`;
        } else {
          verdict = "solide Ergänzung"; cls="v-warn";
          why = `Ordentlicher Zuwachs, aber ${twins.length} ähnliche${twins.length===1?"s":""}
                 Teil${twins.length===1?"":"e"} in ${fam} vorhanden. Die Frage ist,
                 ob es etwas ersetzt oder nur dazukommt.`;
        }

        const rel = Math.round(delta / Math.max(base,1) * 100);
        const redPct = sameSlot ? twins.length / sameSlot * 100 : 0;

        const rows = outfitRows(w, owned);
        rowsByItem[wi] = rows;

        const stackHtml = `<div class="outfit">
          <div class="stack" data-item="${wi}">
            ${rows.map((row,ri)=>{
              const n = row.items.length;
              const item0 = row.items[0];
              const arrows = row.fixed
                ? `<button class="sarrow spacer">‹</button>`
                : `<button class="sarrow" data-act="prev" data-item="${wi}" data-row="${ri}" ${n<=1?"disabled":""}>‹</button>`;
              const arrowsR = row.fixed
                ? `<button class="sarrow spacer">›</button>`
                : `<button class="sarrow" data-act="next" data-item="${wi}" data-row="${ri}" ${n<=1?"disabled":""}>›</button>`;
              const fig = !item0
                ? `<div class="sfig"><span class="snone">kein passendes ${row.label.toLowerCase()} im Schrank</span></div>`
                : `<div class="sfig${row.fixed?" fixed":""}" data-fig="${wi}-${ri}">
                    ${item0.image?`<img src="${esc(item0.image)}" alt="${esc(item0.name)}">`:`<span class="snone">NO IMAGE</span>`}
                  </div>`;
              return `<div class="srow" data-slot="${row.slot}">${arrows}${fig}${arrowsR}</div>`;
            }).join("")}
          </div>
        </div>`;

        return `<article class="item">
          <div class="shot">${ w.image
            ? `<img src="${esc(w.image)}" alt="${esc(w.name)}">`
            : `<span class="none">NO IMAGE</span>` }</div>
          <div>
            <p class="eyebrow">${esc(w.brand||"—")}</p>
            <h2 class="title">${esc(w.name)}</h2>
            <span class="verdict ${cls}">${verdict}</span>

            <div class="numview">
              <div class="metrics">
                <div class="metric">
                  <span class="lab">Neue Outfits</span>
                  ${bar(rel*3, delta===0?"bad":"")}
                  <span class="val">+${delta} &nbsp;<span style="color:var(--ink-soft)">(${rel}%)</span></span>
                </div>
                <div class="metric">
                  <span class="lab">Preis pro Outfit</span>
                  ${bar(cpo==null?0:Math.min(100,cpo*12), cpo!=null&&cpo>8?"warn":"")}
                  <span class="val">${cpo==null?"—":(cpo<10?cpo.toFixed(2):Math.round(cpo))+" €"}</span>
                </div>
                <div class="metric">
                  <span class="lab">Redundanz</span>
                  ${bar(redPct, redPct>50?"bad":redPct>25?"warn":"")}
                  <span class="val">${twins.length} von ${sameSlot} ähnlich</span>
                </div>
              </div>

              <p class="why">${why}</p>
              ${ seasonGain ? `<p class="overlap">Dünnste abgedeckte Saison:
                  ${seasonGain.s} — dort bisher ${seasonGain.before} Outfits.</p>` : "" }
              ${ twins.length ? `<p class="overlap">Überschneidet sich mit:
                  ${twins.slice(0,4).map(d=>esc(d.name)).join(" · ")}${twins.length>4?" …":""}</p>` : "" }
              ${ w.link ? `<p class="overlap"><a href="${esc(w.link)}" target="_blank"
                  rel="noopener">Produktseite →</a></p>` : "" }
            </div>

            <div class="visview">${stackHtml}</div>
          </div>
        </article>`;
      }).join("");

      list.querySelectorAll(".sarrow[data-act]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const wi = +btn.dataset.item, ri = +btn.dataset.row;
          const row = rowsByItem[wi][ri];
          const n = row.items.length;
          if(n<=1) return;
          const key = wi+"-"+ri;
          const cur = stepIx[key] || 0;
          const dir = btn.dataset.act==="next" ? 1 : -1;
          const next = (cur + dir + n) % n;
          stepIx[key] = next;

          const item = row.items[next];
          const fig = list.querySelector(`.sfig[data-fig="${wi}-${ri}"]`);
          if(!fig) return;
          fig.innerHTML = item.image?`<img src="${esc(item.image)}" alt="${esc(item.name)}">`:`<span class="snone">NO IMAGE</span>`;
        });
      });
    }

    document.getElementById("foot").textContent =
      `${owned.length} Teile · ${wish.length} auf der Wishlist · `
      + `Outfit = Oberteil × Unterteil × Schuh, gefiltert nach Saison und Anlass`;
  })
  .catch(e=>{
    document.getElementById("list").innerHTML =
      `<div class="empty"><p>Daten konnten nicht geladen werden. Läuft gerade ein Build?</p></div>`;
    console.error(e);
  });
</script>
</body>
</html>
