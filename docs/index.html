<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Folio — a wardrobe, catalogued</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --panel:#F6F5F1;
  --ink:#17140E;
  --ink-soft:#5B564C;
  --line:#E9E9E6;
  --accent:#6E6CEB;
  --chip:#F0F0EE;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Roboto Mono",ui-monospace,monospace;
  font-size:15px;line-height:1.55;letter-spacing:0;
  overflow-x:hidden;
}
a{color:inherit}
.mono{font-family:"Roboto Mono",ui-monospace,monospace}
.eyebrow{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}

/* cursor dot */
.cursor{position:fixed;top:0;left:0;width:9px;height:9px;border-radius:50%;
  background:var(--accent);pointer-events:none;z-index:200;
  transform:translate(-50%,-50%);transition:transform .12s ease, opacity .2s;mix-blend-mode:multiply}

/* header — Reisinger-style mono, centred statement */
header{background:var(--paper);border-bottom:1px dotted var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;
  gap:16px 24px;flex-wrap:wrap;padding:16px clamp(14px,3vw,22px)}
.wordmark{font-weight:700;font-size:clamp(18px,2.4vw,26px);letter-spacing:.01em;
  text-transform:uppercase}
.count{font-family:"Roboto Mono",monospace;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink)}
.views{display:flex;gap:clamp(12px,2vw,26px);align-items:center}
.views button,.fitlink{font-family:"Roboto Mono",monospace;font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:transparent;
  border:0;padding:2px 0;cursor:pointer;text-decoration:none;white-space:nowrap}
.views button:hover,.fitlink:hover{opacity:.55}
@media(max-width:640px){.bar{gap:12px 16px}.views{width:100%;flex-wrap:wrap}}

/* filter — [+] SEARCH BY FILTER, options as [ ] value */
.filterbar{background:var(--paper);border-bottom:1px dotted var(--ink)}
.filtertoggle{font-family:"Roboto Mono",monospace;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);background:transparent;border:0;
  cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:14px clamp(14px,3vw,22px);width:100%}
.filtertoggle .n{font-family:"Roboto Mono",monospace;color:var(--ink);
  font-size:12px;letter-spacing:.1em}
.filtertoggle .n:empty{display:none}

.panel{overflow:hidden;max-height:0;transition:max-height .34s cubic-bezier(.3,.8,.3,1)}
.panel.open{max-height:min(74vh,820px);overflow:auto;border-top:1px dotted var(--ink)}
.panelinner{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,40px);
  padding:clamp(20px,3vw,32px) clamp(14px,3vw,22px)}
.fgroup .flabel{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:2px 18px}
.opt{font-family:"Roboto Mono",monospace;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);background:transparent;border:0;
  text-align:left;cursor:pointer;padding:5px 0;display:flex;align-items:center;gap:8px}
.opt::before{content:"[ ]";flex:none;white-space:pre}
.opt[aria-pressed="true"]::before{content:"[X]"}
.opt:hover{opacity:.55}
.opt .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.35);flex:none}
.panelfoot{grid-column:1/-1;display:flex;justify-content:flex-start;
  padding-top:10px;border-top:1px dotted var(--ink);margin-top:4px}
.clearbtn{font-family:"Roboto Mono",monospace;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink);background:transparent;border:0;
  cursor:pointer;padding:12px 0}
.clearbtn:hover{opacity:.55}
@media(max-width:820px){.panelinner{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.panelinner{grid-template-columns:1fr;gap:20px}}

/* stage */
.stage{padding:34px clamp(18px,5vw,56px) 60px;position:relative;min-height:60vh}

/* index grid */
/* masonry index — cut-out images, no frame */
.grid{column-count:4;column-gap:clamp(34px,5vw,72px)}
.card{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
  display:block;cursor:pointer;margin:0 0 clamp(48px,6vw,96px);animation:rise .5s both}
.card .frame{overflow:hidden;display:flex;align-items:center;justify-content:center;
  position:relative}
.card .frame img{display:block;width:100%;height:auto;
  transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card .frame.empty{min-height:180px;border:1px dotted var(--line)}
.card:hover .frame img{transform:scale(1.04)}
.brandtag{position:absolute;top:10px;left:10px;z-index:2;
  font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);
  opacity:0;transition:opacity .22s;pointer-events:none}
.card:hover .brandtag,.card:focus-visible .brandtag{opacity:1}
@media(hover:none){.brandtag{opacity:1}}
@media(max-width:1200px){.grid{column-count:3}}
@media(max-width:820px){.grid{column-count:2;column-gap:clamp(24px,5vw,44px)}}
@media(max-width:460px){.grid{column-count:2;column-gap:20px}
  .card{margin-bottom:36px}}

/* scatter */
.scatter{position:relative;min-height:1200px}
.scatter .card{position:absolute;width:210px;animation:none}
.scatter .card .frame{height:250px}
.scatter .card .frame img{width:auto;max-width:100%;max-height:100%;object-fit:contain}
.scatter .card{touch-action:none}
.scatter .tag{position:absolute;top:8px;left:8px;z-index:2;
  font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.12em;
  background:var(--paper);border:1px solid var(--line);padding:2px 7px;border-radius:100px}
.hint{font-family:"Roboto Mono",monospace;font-size:11px;color:var(--ink-soft);
  text-align:center;padding:6px 0 18px;letter-spacing:.08em}
@media(max-width:720px){.scatter{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
  .scatter .card{position:static!important;width:auto;transform:none!important}
  .hint{display:none}}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:120;display:none;background:rgba(23,20,14,.62);
  backdrop-filter:blur(3px);padding:clamp(14px,4vw,48px)}
.lb.open{display:grid;place-items:center}
.sheet{background:var(--paper);border:1px dotted var(--line);max-width:920px;width:100%;
  max-height:90vh;overflow:auto;display:grid;grid-template-columns:1.1fr .9fr;
  animation:rise .3s both}
.sheet .big{background:var(--paper);border-right:1px dotted var(--line);
  display:flex;align-items:center;justify-content:center;padding:34px;min-height:340px}
.sheet .big img{max-width:100%;max-height:64vh;object-fit:contain}
.sheet .info{padding:clamp(22px,3vw,40px);position:relative}
.sheet .info h2{margin:14px 0 2px;font-weight:400;font-size:clamp(20px,2.4vw,26px);
  letter-spacing:0;line-height:1.15}
.spec{margin-top:24px;border-top:1px dotted var(--ink)}
.spec .row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;
  border-bottom:1px dotted var(--line);font-family:"Roboto Mono",monospace;font-size:13px}
.spec .row .k{color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.close{position:absolute;top:14px;right:16px;border:1px solid var(--line);background:transparent;
  width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
.close:hover{border-color:var(--ink)}
@media(max-width:680px){.sheet{grid-template-columns:1fr}
  .sheet .big{border-right:0;border-bottom:1px dotted var(--line)}}

footer{border-top:1px dotted var(--ink);padding:34px clamp(18px,5vw,56px);
  display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;
  font-family:"Roboto Mono",monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.06em}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="theme-color" content="#FFFFFF">
</head>
<body>
<div class="cursor" id="cursor" aria-hidden="true"></div>

<header>
  <div class="bar">
    <div class="wordmark">ATELIER · FOLIO</div>
    <div class="views" role="group" aria-label="View">
      <button id="vIndex" aria-pressed="true">[X] INDEX</button>
      <button id="vScatter" aria-pressed="false">[ ] SCATTER</button>
      <a class="fitlink" href="fitting.html">[+] FITTING ROOM</a>
      <a class="fitlink" href="board.html">[+] BOARD</a>
    </div>
    <div class="count mono" id="count">loading…</div>
  </div>
</header>

<div class="filterbar">
  <button class="filtertoggle" id="ftoggle" aria-expanded="false" aria-controls="panel">
    <span id="ftsign">[+]</span> SEARCH BY FILTER <span class="n" id="fcount"></span>
  </button>
  <div class="panel" id="panel">
    <div class="panelinner">
      <div class="fgroup"><p class="flabel">Type</p><div class="opts" id="catset"></div></div>
      <div class="fgroup"><p class="flabel">House</p><div class="opts" id="brandset"></div></div>
      <div class="fgroup"><p class="flabel">Colour</p><div class="opts" id="colourset"></div></div>
      <div class="fgroup"><p class="flabel">Season</p><div class="opts" id="seasonset"></div></div>
      <div class="fgroup"><p class="flabel">Wear</p><div class="opts" id="formset"></div></div>
      <div class="fgroup"><p class="flabel">Era</p><div class="opts" id="eraset"></div></div>
      <div class="panelfoot">
        <button class="clearbtn" id="clearbtn">[×] CLEAR ALL</button>
      </div>
    </div>
  </div>
</div>


<main class="stage">
  <p class="hint" id="hint" style="display:none">Drag the pieces around — they stay where you leave them.</p>
  <div class="grid" id="stage"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Piece detail">
  <div class="sheet" id="sheet"></div>
</div>

<footer>
  <span id="stamp">wardrobe inventory</span>
  <span>Images © their respective brands</span>
</footer>

<script>
let DATA = [];

const SWATCH={"light grey":"#c9c9c9","black":"#1c1c1c","beige":"#d8c7a8","off black":"#2a2a2a",
"off white":"#efeae0","mole dark":"#6f6357","crystal linen":"#e6ddcb","aurora coffee":"#7c6a5d",
"scampi":"#e8825f","better scarlet/white":"#c2352c","night indigo/white":"#2f3552",
"Weiß":"#f2efe8","braun":"#7c5a3a"};
const swatch=c=>SWATCH[c]||"#bdb6a6";
const eur=s=>{const m=(s||"").replace(/\./g,"").match(/(\d+),(\d{2})/);return m?+m[1]+ +m[2]/100:null;};
const cpw=d=>{const p=eur(d.price);if(p==null||!d.worn)return"—";
  const v=p/d.worn;return(v<10?v.toFixed(2):Math.round(v))+" € / Tragen";};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

let state={cat:"All",brand:"All",colour:"All",season:"All",form:"All",era:"All",view:"index"};
const stage=document.getElementById('stage');
const FKEYS=['cat','brand','colour','season','form','era'];

/* build a filter group as a text list; colour rows carry a swatch dot */
function opts(id,key,values,withDot){
  const box=document.getElementById(id);
  box.innerHTML='';
  [["All","All"],...values.map(v=>[v,v])].forEach(([label,val])=>{
    const b=document.createElement('button');
    b.className='opt'+(val==="All"?' allopt':'');
    b.setAttribute('aria-pressed',val===state[key]);
    b.innerHTML=(withDot&&val!=="All"
        ? `<span class="dot" style="background:${swatch(val)}"></span>`:'')
      +`<span>${esc(label)}</span>`;
    b.onclick=()=>{
      state[key]=val;
      [...box.querySelectorAll('.opt')].forEach((c,idx)=>{
        const cv=idx===0?"All":values[idx-1];
        c.setAttribute('aria-pressed',cv===val);
      });
      render();
    };
    box.appendChild(b);
  });
}
function buildChrome(){
  opts('catset','cat',[...new Set(DATA.flatMap(d=>d.categories))].sort());
  opts('brandset','brand',[...new Set(DATA.map(d=>d.brand).filter(Boolean))].sort());
  opts('colourset','colour',[...new Set(DATA.flatMap(d=>d.colors||[]).filter(Boolean))].sort(),true);
  opts('seasonset','season',[...new Set(DATA.flatMap(d=>d.seasons||[]))]);
  opts('formset','form',[...new Set(DATA.map(d=>d.formality).filter(Boolean))]);
  opts('eraset','era',[...new Set(DATA.map(d=>d.era).filter(Boolean))]);
}

function filtered(){
  return DATA.filter(d=>
    (state.cat==="All"||d.categories.includes(state.cat))&&
    (state.brand==="All"||d.brand===state.brand)&&
    (state.colour==="All"||(d.colors||[]).includes(state.colour))&&
    (state.season==="All"||(d.seasons||[]).includes(state.season))&&
    (state.form==="All"||d.formality===state.form)&&
    (state.era==="All"||d.era===state.era));
}

function cardEl(d,i){
  const el=document.createElement('article');
  el.className='card';
  el.style.animationDelay=(i*0.03)+'s';
  el.tabIndex=0;
  el.innerHTML=`
    <div class="frame${d.image?'':' empty'}">
      ${d.brand?`<span class="brandtag">${esc(d.brand)}</span>`:''}
      ${d.image?`<img loading="lazy" src="${d.image}" alt="${esc(d.brand)} ${esc(d.name)}">`:`<span class="mono" style="font-size:11px;color:var(--ink-soft);letter-spacing:.14em">NO IMAGE</span>`}
    </div>`;
  const open=()=>openSheet(d);
  el.onclick=open;
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  return el;
}

function render(){
  const list=filtered();
  document.getElementById('count').textContent=list.length+(list.length===1?' PIECE':' PIECES');
  const active=FKEYS.filter(k=>state[k]!=='All').length;
  document.getElementById('fcount').textContent=active?'('+active+')':'';
  stage.className=state.view==='index'?'grid':'scatter';
  document.getElementById('hint').style.display=state.view==='scatter'?'block':'none';
  stage.innerHTML='';
  list.forEach((d,i)=>{
    const el=cardEl(d,i);
    if(state.view==='scatter') placeScatter(el,i,list.length);
    stage.appendChild(el);
  });
}

/* scatter placement + drag */
function placeScatter(el,i,n){
  const cols=Math.min(4,Math.max(2,Math.round(window.innerWidth/340)));
  const col=i%cols, row=Math.floor(i/cols);
  const jx=((i*53)%40)-20, jy=((i*29)%36)-18, rot=((i*37)%16)-8;
  const w=window.innerWidth<1200?window.innerWidth-90:1100;
  const x=40+col*(w/cols)+jx;
  const y=20+row*300+jy;
  el.style.left=x+'px';el.style.top=y+'px';el.style.transform='rotate('+rot+'deg)';
  const tag=document.createElement('span');tag.className='tag mono';tag.textContent=String(i+1).padStart(2,'0');
  el.appendChild(tag);
  makeDraggable(el);
}
function makeDraggable(el){
  let sx,sy,ox,oy,drag=false,moved=false;
  el.addEventListener('pointerdown',e=>{
    drag=true;moved=false;el.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);
    el.style.zIndex=50;el.style.cursor='grabbing';
  });
  el.addEventListener('pointermove',e=>{
    if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    el.style.left=(ox+dx)+'px';el.style.top=(oy+dy)+'px';
  });
  const up=()=>{drag=false;el.style.cursor='grab';};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();}},true);
}

/* lightbox */
const lb=document.getElementById('lb'),sheet=document.getElementById('sheet');
function openSheet(d){
  const rows=[["Brand",d.brand],["Category",d.categories.join(" / ")],["Colour",(d.colors||[]).join(" / ")||d.color||"—"],["Size",d.size],
    ["Price",d.price],["Season",(d.seasons||[]).join(" / ")||"—"],["Wear",d.formality||"—"],["Era",d.era||"—"],["Worn",d.worn==null?"—":d.worn+"×"],["Image",d.own_photo?"own photo":d.image?"retailer":"—"],["Per wear",cpw(d)]];
  sheet.innerHTML=`
    <div class="big">${d.image?`<img src="${d.image}" alt="${esc(d.brand)} ${esc(d.name)}">`:`<span class="mono" style="font-size:12px;color:var(--ink-soft);letter-spacing:.14em">NO IMAGE</span>`}</div>
    <div class="info">
      <button class="close" aria-label="Close" id="x">×</button>
      <p class="eyebrow">${esc(d.brand)}</p>
      <h2>${esc(d.name)}</h2>
      <div class="spec">${rows.map(r=>`<div class="row"><span class="k">${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}</div>
    </div>`;
  lb.classList.add('open');document.getElementById('x').onclick=closeSheet;
}
function closeSheet(){lb.classList.remove('open')}
lb.addEventListener('click',e=>{if(e.target===lb)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* view toggle */
const vI=document.getElementById('vIndex'),vS=document.getElementById('vScatter');
function setView(v){
  state.view=v;
  vI.textContent=(v==='index'?'[X]':'[ ]')+' INDEX';
  vS.textContent=(v==='scatter'?'[X]':'[ ]')+' SCATTER';
  vI.setAttribute('aria-pressed',v==='index');
  vS.setAttribute('aria-pressed',v==='scatter');
  render();
}
vI.onclick=()=>setView('index');
vS.onclick=()=>setView('scatter');

/* filter panel */
const ftoggle=document.getElementById('ftoggle'),panel=document.getElementById('panel');
ftoggle.onclick=()=>{
  const open=panel.classList.toggle('open');
  ftoggle.setAttribute('aria-expanded',open);
  document.getElementById('ftsign').textContent=open?'[−]':'[+]';
};
document.getElementById('clearbtn').onclick=()=>{
  FKEYS.forEach(k=>state[k]='All');
  buildChrome();
  render();
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&panel.classList.contains('open')){
    panel.classList.remove('open');ftoggle.setAttribute('aria-expanded','false');
  }
});

/* cursor dot (desktop only) */
const cur=document.getElementById('cursor');
if(matchMedia('(pointer:fine)').matches){
  addEventListener('pointermove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});
  addEventListener('pointerdown',()=>cur.style.transform='translate(-50%,-50%) scale(2)');
  addEventListener('pointerup',()=>cur.style.transform='translate(-50%,-50%) scale(1)');
}else{cur.style.display='none'}

addEventListener('resize',()=>{if(state.view==='scatter')render()});

/* ---- load data ---- */
fetch('data.json?v='+Date.now())
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(payload=>{
    DATA=(payload.items||[]).filter(d=>d.status!=='Wishlist');
    // interleave categories: one shuffle per session, stable across filtering
    for(let i=DATA.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [DATA[i],DATA[j]]=[DATA[j],DATA[i]];
    }
    buildChrome();
    render();
    const d=new Date(payload.generated_at);
    document.getElementById('stamp').textContent=
      DATA.length+' pieces · '+payload.brands+' brands · updated '+
      d.toISOString().slice(0,10);
  })
  .catch(err=>{
    stage.innerHTML='<p class="hint" style="display:block">'+
      'Could not load the catalogue. The last build may still be running — try again in a minute.</p>';
    console.error(err);
  });
</script>
</body>
</html>
